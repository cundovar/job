name: Daily Job Scraping

on:
  schedule:
    # Tous les jours à 7h00 UTC (8h Paris hiver, 9h été)
    - cron: '0 7 * * *'
  
  # Permet aussi le lancement manuel depuis GitHub UI
  workflow_dispatch:

jobs:
  scrape-and-analyze:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Cache Python dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Create data directories
      run: |
        mkdir -p data/logs
    
    - name: Run job scraper
      env:
        DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        GOOGLE_SHEETS_CREDENTIALS_JSON: ${{ secrets.GOOGLE_SHEETS_CREDENTIALS_JSON }}
        GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
        EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
        EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        EMAIL_RECIPIENT: ${{ secrets.EMAIL_RECIPIENT }}
        SCRAPING_DELAY_SECONDS: 2
        MAX_JOBS_PER_SITE: 50
        SCORE_THRESHOLD_AI_ANALYSIS: 50
        LOG_LEVEL: INFO
      run: |
        python main.py
    
    - name: Upload logs as artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: scraping-logs-${{ github.run_number }}
        path: data/logs/
        retention-days: 30
    
    - name: Upload job cache
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: jobs-cache-${{ github.run_number }}
        path: data/jobs_cache.json
        retention-days: 7
    
    - name: Notify on failure
      if: failure()
      uses: dawidd6/action-send-mail@v3
      with:
        server_address: smtp.gmail.com
        server_port: 587
        username: ${{ secrets.EMAIL_SENDER }}
        password: ${{ secrets.EMAIL_PASSWORD }}
        subject: "⚠️ Job Search Automation Failed"
        to: ${{ secrets.EMAIL_RECIPIENT }}
        from: ${{ secrets.EMAIL_SENDER }}
        body: |
          The daily job scraping workflow failed.
          
          Workflow: ${{ github.workflow }}
          Run: ${{ github.run_number }}
          Time: ${{ github.event.head_commit.timestamp }}
          
          Check logs at: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
