# config/companies.yaml
# Critères de ciblage — choix produit, validés le 18/09/2026
# À ajuster manuellement, ce fichier ne doit pas être régénéré par déduction automatique

criteres:
  type_structure:
    - agence_com_engagee   # agences de communication "engagée" / éthique
    - scop                 # coopératives (SCOP/SCIC)
  zone: ile_de_france
  taille_max_effectif: 15
  note: >
    Une structure qui ne coche pas ces trois critères ne doit pas être ajoutée
    à cette liste, même si elle a été évoquée ailleurs comme piste (prestation,
    freelance, etc.).

# Poste visé par défaut selon le type de structure.
#
# Ce n'est PAS un constat sur l'entreprise : c'est notre intention de
# candidature. Il ne peut donc jamais être "CONFIRMED" par le Vérificateur.
# Il doit rester déclaré ici, versionné et relisible — jamais déduit du site.
#
# Les intitulés sont repris des target_positions de config/criteria.yaml
# (priorité 1) pour rester cohérents avec les variantes de CV existantes.
# Surchargeable entreprise par entreprise via la colonne "poste_vise" du CSV.
poste_vise_par_type:
  agence_com_engagee: "Développeur web / Intégrateur"
  scop: "Développeur full-stack PHP / Symfony"

# Statuts possibles : a_qualifier | prioritaire | secondaire | ecartee
# "taille_verifiee: false" = taille non confirmée, à vérifier avant contact
#
# Ce fichier est l'espace de qualification humaine : il peut contenir des pistes
# sans URL. Seules les structures dont l'URL a été relevée en clair passent dans
# config/companies.csv, qui est la seule entrée lue par le prospecteur.
companies:
