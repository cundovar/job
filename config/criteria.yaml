      points: 10
      variants: ["mediation numerique", "inclusion numerique", "conseiller numerique", "france services", "fracture numerique", "demarches en ligne"]
    - skill: "accueil_publics"
      points: 6
      variants: ["accueil du public", "accueil des publics", "accueil physique", "accueil telephonique", "orientation des publics", "information et orientation"]
