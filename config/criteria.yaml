# Scoring par compétences (bonus/malus)
skills_matching:
  enabled: true
  sources_to_scan:
    - "title"
    - "description"
    - "requirements"

  hard_bonus:
    # CMS / institutionnel : réduits pour ne pas favoriser chef de projet
    - skill: "wordpress"
      points: 6
      variants: ["wordpress", "wp", "gutenberg"]
    - skill: "joomla"
      points: 5
      variants: ["joomla"]
    - skill: "drupal"
      points: 5
      variants: ["drupal"]
    - skill: "accessibilite"
      points: 8
      variants: ["rgaa", "wcag", "accessibilité", "accessibilite", "a11y"]
    - skill: "ticketing"
      points: 7
      variants: ["ticketing", "jira", "glpi", "redmine", "service now", "servicenow"]
    - skill: "microsoft 365"
      points: 6
      variants: ["microsoft 365", "office 365", "m365", "sharepoint", "teams"]

    # Stack dev : réduits le 10/2026 — les annonces dev sont dépriorisées,
    # les gros bonus faisaient remonter backend/frontend au-dessus de
    # webmaster/formateur/intégrateur malgré les poids de target_positions.
    - skill: "symfony"
      points: 6
      variants: ["symfony", "symfony 5", "symfony 6", "symfony 7"]
    - skill: "react"
      points: 5
      variants: ["react", "reactjs", "react.js"]
    - skill: "vue"
