# Postes Recherchés — refonte du 18/11/2026 (demande Cundo)
# Quatre axes, repris des tâches planifiées « Offres emploi », SANS l'axe
# périscolaire / accueil de loisirs / enfance-jeunesse, et sans les métiers
# jamais exercés (règle 0 : médiateur emploi, chargé d'insertion, conseiller
# emploi, helpdesk, PO/AMOA, DevRel, LMS, responsable/manager…).
#   A. Médiation et inclusion numérique
#   B. Animation socioculturelle, ateliers et accueil des publics
#   C. Web (webmaster, contenu, WordPress) puis développement junior
#   D. Formation web / numérique / IA et automatisation
# Les TROIS PREMIERS mots-clés de chaque poste sont ceux envoyés aux sites
# d'annonces (pipeline.extract_search_keywords) : des termes distincts et
# productifs, pas des variantes d'orthographe. Les suivants servent au tri.
target_positions:
  # --- AXE A : médiation et inclusion numérique ---
  - name: "Médiation numérique / inclusion numérique"
    axis: "A"
    priority: 1
    keywords:
      - "mediateur numerique"
      - "conseiller numerique"
      - "france services"
      - "mediatrice numerique"
      - "mediation numerique"
      - "conseillere numerique"
      - "inclusion numerique"
      - "aidant numerique"
      - "aidants connect"
      - "accompagnement numerique"
      - "accompagnement aux demarches"
      - "demarches en ligne"
      - "espace public numerique"
      - "espace numerique"
      - "epn"
      - "animateur epn"
      - "referent numerique"
      - "formateur numerique"
      - "formatrice numerique"
    score_weight: 80

  # --- AXE B : animation socioculturelle, ateliers, accueil (sans périscolaire) ---
  - name: "Animation socioculturelle / centre social / familles"
    axis: "B"
    priority: 1
    keywords:
      - "animateur centre social"
      - "referent famille"
      - "animateur multimedia"
