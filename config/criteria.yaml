# Salaire (soft filter + scoring)
salary:
  filter_enabled: true
  # Objectif : viser 1800–2500 net ≈ 2300–3300 brut selon contextes
  preferences:
    # Abaissé le 18/11/2026 : grilles fonction publique catégorie C et ESS
    min_gross_monthly: 1900
    target_gross_monthly: 2400
    max_gross_monthly: 3600
  scoring:
    salary_mentioned_bonus: 5
    in_range_bonus: 8
    below_min_penalty: -12
    far_below_min_penalty: -20
    missing_salary_penalty: -2

# Scoring Configuration
scoring:
  thresholds:
    ignore: 55
    basic_ai_analysis: 70
    detailed_ai_analysis: 80

  bonus_points:
    company_known_in_ess: 5
    recent_post_last_48h: 3

  email_digest:
    enabled: true
    buckets:
      top_matches_min_score: 80
      consider_min_score: 65
      wildcard_min_score: 55
      wildcard_max_count: 1

# Configuration IA
ai_analysis:
  provider: "deepseek"
  model: "deepseek-chat"
  temperature: 0.3
  max_tokens: 1200
  prompt_language: "french"

  required_fields:
    - "pertinence_score"
    - "points_forts"
    - "points_faibles"
    - "red_flags"
    - "recommandation"
    - "angle_motivation"
    - "raison_breve"

# Configuration Scraping
scraping:
  enabled_sites:
    - indeed
    - apec
    - welcome_to_the_jungle
    - emploi_asso
    # - pole_emploi
    # - linkedin

  rate_limiting:
    delay_between_requests_seconds: 2
    max_retries: 3
    timeout_seconds: 30

  max_jobs_per_site:
    indeed: 40
    apec: 40
    welcome_to_the_jungle: 30
    emploi_asso: 60

  max_job_age_days: 14

# Configuration Email
email:
  # Coupé le 18/11/2026 (décision Cundo) : le récap de chaque recherche ne
  # part plus par mail ; les offres se lisent dans l'interface.
  send_daily: false
  send_time_utc: "07:00" # 8h Paris hiver
  recipient: "varas.cundo@gmail.com"

  content:
    max_jobs_in_email: 15
    include_maybe_jobs: true
    include_statistics: true

  triggers:
    send_even_if_no_jobs: true
    alert_on_high_priority_job: true
    high_priority_threshold_score: 85

# Configuration Cache
cache:
  enabled: true
  deduplicate_by:
    - "url"
    - "title + company"
  cache_duration_days: 30

# Logging
logging:
  level: "INFO" # DEBUG, INFO, WARNING, ERROR
  save_to_file: true
  file_path: "data/logs/"

# Notifications
notifications:
  email_on_error: true
  email_on_success: false
  slack_webhook: null
