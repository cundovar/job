      - "economie sociale et solidaire"
      - "association"
      - "fondation"
      - "coopérative"
      - "cooperative"
      - "scop"
      - "scic"
      - "ong"
      - "non-profit"
      - "entreprise adaptée"
      - "entreprise adaptee"
      - "esat"
      - "insertion"
      - "insertion professionnelle"
      - "insertion par l'activite economique"
      - "iae"
      - "education populaire"
      - "centre social"
      - "mission locale"
      - "tiers-lieu"
      - "tiers lieu"

  public:
    priority: 2
    score_weight: 25
    keywords:
      - "secteur public"
      - "collectivite"
      - "collectivités"
      - "mairie"
      - "ville de"
      - "conseil regional"
      - "conseil departemental"
