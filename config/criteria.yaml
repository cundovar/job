# Configuration des Critères de Recherche d'Emploi
# Ce fichier est utilisé par le système pour filtrer et scorer les offres

# Informations Utilisateur
user_profile:
  name: "Facundo Varas"
  email: "varas.cundo@gmail.com"
  current_location: "Paris 20e (75020)"

  # Important : dissocier expérience tech et expérience globale (utile à 46 ans)
  tech_experience_years: 1
  overall_experience_years: 15

  education: "BAC+2 + Bootcamp Web Dev 2020"

  skills:
    frontend:
      - HTML5
      - CSS3
      - JavaScript
      - React
      - Vue.js
    backend:
      - PHP
      - Symfony
      - Node.js
    other:
      - SQL
      - Git
      - Pédagogie
      - Formation adultes

# Normalisation / synonymes pour améliorer le matching
text_normalization:
  enabled: true
  lowercase: true
  remove_accents: true
  collapse_spaces: true
  synonyms:
    "product owner":
      - "po"
      - "product-owner"
      - "productowner"
    "chef de projet":
      - "chef(fe) de projet"
      - "cp digital"
      - "project manager"
      - "project lead"
    "charge de projet":
      - "chef de projet"
      - "project manager"
      - "coordinateur"
      - "coordination"
    "coordinateur numerique":
      - "referent numerique"
      - "referent outils"
      - "support outils"
      - "support applicatif"
      - "support fonctionnel"
      - "gestion des outils"
    "webmaster":
      - "gestionnaire de contenu"
      - "administrateur de contenu"
      - "admin cms"
      - "gestion de site"
      - "gestion de portail"
    "teletravail":
      - "télétravail"
      - "remote"
      - "full remote"
      - "100% remote"
      - "distanciel"
    "hybride":
      - "hybrid"
      - "mixte"
      - "partiel"

# Postes Recherchés (ordre de priorité)
target_positions:
  # --- POSTES CIBLES "STABLES" (ton tableau ✅/⚖️/faible risque) ---
  - name: "Chargé de projet web"
    priority: 1
    keywords:
      - "charge de projet web"
      - "chargé de projet web"
      - "chef de projet web"
      - "chef de projet digital"
      - "chef de projet numerique"
      - "chef de projet site web"
      - "gestion de projet web"
      - "coordination projet web"
      - "pilotage de prestataires"
      - "cahier des charges"
      - "recette"
      - "suivi de production"
      - "maintenance evolutive"
      - "amoe"
      - "amoa"
    score_weight: 55

  - name: "Coordinateur numérique"
    priority: 2
    keywords:
      - "coordinateur numerique"
      - "coordonnateur numerique"
      - "referent numerique"
      - "referent outils"
      - "referent digital"
      - "support applicatif"
      - "support fonctionnel"
      - "gestion des outils"
      - "accompagnement utilisateurs"
      - "formation utilisateurs"
      - "documentation"
      - "gestion du parc applicatif"
      - "outils collaboratifs"
      - "microsoft 365"
      - "google workspace"
      - "intranet"
      - "crm"
    score_weight: 50

  - name: "Webmaster institutionnel"
    priority: 3
    keywords:
      - "webmaster"
      - "webmestre"
      - "administrateur cms"
      - "admin cms"
      - "gestionnaire de contenu"
      - "administrateur de site"
      - "gestion de site"
      - "maintenance site"
      - "drupal"
      - "wordpress"
      - "joomla"
      - "accessibilite"
      - "rgaa"
      - "service public"
      - "portail"
      - "site institutionnel"
    score_weight: 48
    sector_restriction: ["Public", "ESS", "Impact"]

  # --- OPTIONNEL : formation web (si tu veux garder cette piste) ---
  - name: "Formateur développement web"
    priority: 4
    keywords:
      - "formateur web"
      - "formateur developpement"
      - "enseignant developpement web"
      - "intervenant web"
      - "formateur numerique"
      - "animation d'ateliers"
      - "ateliers numeriques"
      - "mentorat"
      - "tutorat"
      - "bootcamp"
      - "ingenierie pedagogique"
      - "concepteur pedagogique"
      - "titre professionnel"
      - "rncp"
    score_weight: 38

  # --- OPTIONNEL : dev web uniquement en ESS/Public/Impact ---
  - name: "Développeur web (ESS/Public/Impact)"
    priority: 5
    keywords:
      - "developpeur web"
      - "developpeur fullstack"
      - "developpeur symfony"
      - "developpeur react"
      - "developpeur vue"
      - "developpeur php"
      - "developpeur frontend"
      - "developpeur backend"
    score_weight: 24
    sector_restriction: ["ESS", "Public", "Impact"]

# Scoring par compétences (bonus/malus)
skills_matching:
  enabled: true
  sources_to_scan:
    - "title"
    - "description"
    - "requirements"

  hard_bonus:
    - skill: "symfony"
      points: 10
      variants: ["symfony", "symfony 5", "symfony 6", "symfony 7"]
    - skill: "react"
      points: 8
      variants: ["react", "reactjs", "react.js"]
    - skill: "vue"
      points: 8
      variants: ["vue", "vuejs", "vue.js", "nuxt", "nuxtjs"]
    - skill: "php"
      points: 6
      variants: ["php", "php8", "php 8"]
    - skill: "sql"
      points: 5
      variants: ["sql", "mysql", "postgresql", "postgres"]
    - skill: "git"
      points: 3
      variants: ["git", "github", "gitlab"]

  soft_bonus:
    - skill: "pédagogie"
      points: 8
      variants: ["pédagogie", "andragogie", "formation adultes", "animation", "atelier", "facilitation"]
    - skill: "formation"
      points: 6
      variants: ["formateur", "formation", "enseignement", "mentorat", "tutorat"]

  mismatch_penalties:
    - keyword_group: "stack_hors_scope_fort"
      points: -18
      keywords: ["c#", ".net", "dotnet", "sap", "cobol"]
    - keyword_group: "devops_lourd"
      points: -12
      keywords: ["kubernetes", "k8s", "terraform", "sre", "site reliability", "on-call", "astreinte"]

