# Scoring par compétences (bonus/malus)
skills_matching:
  enabled: true
  sources_to_scan:
    - "title"
    - "description"
    - "requirements"

  hard_bonus:
    # CMS / institutionnel : réduits pour ne pas favoriser chef de projet
    - skill: "wordpress"
      points: 6
      variants: ["wordpress", "wp", "gutenberg"]
    - skill: "joomla"
      points: 5
      variants: ["joomla"]
    - skill: "drupal"
      points: 5
      variants: ["drupal"]
    - skill: "accessibilite"
      points: 8
      variants: ["rgaa", "wcag", "accessibilité", "accessibilite", "a11y"]
    - skill: "ticketing"
      points: 7
      variants: ["ticketing", "jira", "glpi", "redmine", "service now", "servicenow"]
    - skill: "microsoft 365"
      points: 6
      variants: ["microsoft 365", "office 365", "m365", "sharepoint", "teams"]

    # Stack dev : augmentés pour favoriser les annonces dev
    - skill: "symfony"
      points: 12
      variants: ["symfony", "symfony 5", "symfony 6", "symfony 7"]
    - skill: "react"
      points: 8
      variants: ["react", "reactjs", "react.js"]
    - skill: "vue"
      points: 8
      variants: ["vue", "vuejs", "vue.js", "nuxt", "nuxtjs"]
    - skill: "php"
      points: 8
      variants: ["php", "php8", "php 8", "php7"]
    - skill: "javascript"
      points: 8
      variants: ["javascript", "js", "es6", "typescript", "ts"]
    - skill: "sql"
      points: 5
      variants: ["sql", "mysql", "postgresql", "postgres"]
    - skill: "git"
      points: 3
      variants: ["git", "github", "gitlab"]
    - skill: "docker"
      points: 4
      variants: ["docker", "containerisation", "containers"]

  soft_bonus:
    - skill: "junior"
      points: 10
      variants: ["junior", "débutant", "debutant", "première expérience", "premiere experience", "profil junior", "1 à 3 ans", "1 an d'expérience"]
    - skill: "diplome_bac2"
      points: 8
      variants: ["bac+2", "bac +2", "niveau 5", "rncp 5", "bts", "dut", "licence pro"]
    # Formation : augmentés pour favoriser formateur
    - skill: "pédagogie"
      points: 12
      variants: ["pédagogie", "andragogie", "formation adultes", "animation", "atelier", "facilitation"]
    - skill: "formation"
      points: 10
      variants: ["formateur", "formation", "enseignement", "mentorat", "tutorat", "enseignant"]
    - skill: "accompagnement"
      points: 6
      variants: ["accompagnement", "coaching", "suivi"]

  mismatch_penalties:
    - keyword_group: "support_non_web"
      points: -35
      keywords: ["support applicatif", "support fonctionnel", "business analyst", "responsable applications", "responsable outils", "consolidation", "tresorerie", "finance"]
    - keyword_group: "stack_hors_scope_fort"
      points: -18
      keywords: ["c#", ".net", "dotnet", "sap", "cobol"]
    - keyword_group: "devops_lourd"
      points: -12
      keywords: ["kubernetes", "k8s", "terraform", "sre", "site reliability", "on-call", "astreinte"]
    - keyword_group: "data_science"
      points: -10
      keywords: ["data science", "machine learning", "deep learning", "ia avancee", "nlp", "computer vision"]

