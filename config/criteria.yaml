# Localisation
location:
  accepted_zones:
    - "Paris"
    - "Paris 20"
    - "Paris 20e"
    - "75020"
    - "Île-de-France"
    - "Ile-de-France"
    - "IDF"
    - "91"
    - "92"
    - "93"
    - "94"
    - "95"
  remote_accepted: true
  hybrid_accepted: true
  score_weights:
    paris: 10
    paris20: 10
    idf: 8
    remote: 10
    hybrid: 9

# Types de Contrat
contracts:
  accepted:
    - type: "CDI"
      priority: 1
      score_weight: 15
    - type: "CDD"
      priority: 2
      score_weight: 10
      min_duration_months: 6
    - type: "Freelance"
      priority: 3
      score_weight: 7
      min_hours_per_week: 15
      required_volume_guarantee: true
    - type: "Bénévolat"
      priority: 4
      score_weight: 1

  rejected:
    - "Stage"
    - "Alternance"
    - "Apprentissage"
    - "Contrat pro"

# Red Flags (Exclusions Automatiques + Malus)
red_flags:
  # Exclusions strictes : uniquement ce qui est vraiment incompatible
  hard_exclude_keywords:
    - "stage"
    - "stagiaire"
    - "alternance"
    - "apprentissage"
    - "apprenti"
    - "contrat de professionnalisation"

  # Surcharge / annonce Frankenstein (on ne bloque pas forcément, mais gros malus)
  soft_penalty_keywords:
    - keyword: "bac+5"
      points: -10
    - keyword: "bac +5"
      points: -10
    - keyword: "master"
      points: -10
    - keyword: "mobilisable en urgence"
      points: -10
    - keyword: "pics d'activité"
      points: -8
    - keyword: "rythme irrégulier"
      points: -8
    - keyword: "r&d"
      points: -8
    - keyword: "recherche appliquee"
      points: -8
    - keyword: "data science"
      points: -10
    - keyword: "machine learning"
      points: -10
    - keyword: "ia"
      points: -8
    - keyword: "automatisation marketing"
      points: -12
    - keyword: "strategie marketing"
      points: -12
    - keyword: "seo"
      points: -6
    - keyword: "sea"
      points: -8
    - keyword: "social ads"
      points: -10
    - keyword: "prospection"
      points: -12
    - keyword: "cold calling"
      points: -14
    - keyword: "vente"
      points: -8
    - keyword: "rémunération selon profil"
      points: -6
    - keyword: "remuneration selon profil"
      points: -6

  hard_exclude_keywords_tech:
    - "crypto"
    - "cryptocurrency"
    - "blockchain"
    - "web3"
    - "nft"
    - "token"
    - "metaverse"

  sectors_to_exclude:
    - "banque commerciale"
    - "assurance commerciale"
    - "grande distribution"
    - "luxe"
    - "gaming"
    - "paris sportifs"
    - "publicité pure"
    - "publicite pure"
    - "marketing agressif"

  companies_to_exclude: []

  exclude_if_contains:
    - "inscription"
    - "catalogue"
    - "cpf"
    - "programme de formation"
    - "tarif"
    - "session de formation"

  keep_if_contains:
    - "formateur"
    - "formatrice"
    - "poste de formateur"

# Salaire (soft filter + scoring)
salary:
  filter_enabled: true
  # Objectif : viser 1800–2500 net ≈ 2300–3300 brut selon contextes
  preferences:
    min_gross_monthly: 2300
    target_gross_monthly: 2800
    max_gross_monthly: 3600
  scoring:
    salary_mentioned_bonus: 5
    in_range_bonus: 8
    below_min_penalty: -12
    far_below_min_penalty: -20
    missing_salary_penalty: -2

# Scoring Configuration
scoring:
  thresholds:
    ignore: 49
    basic_ai_analysis: 50
    detailed_ai_analysis: 70

  bonus_points:
    company_known_in_ess: 5
    recent_post_last_48h: 3

  email_digest:
    enabled: true
    buckets:
      top_matches_min_score: 80
      consider_min_score: 65
      wildcard_min_score: 55
      wildcard_max_count: 1

# Configuration IA
ai_analysis:
  provider: "deepseek"
  model: "deepseek-chat"
  temperature: 0.3
  max_tokens: 1200
  prompt_language: "french"

  required_fields:
    - "pertinence_score"
    - "points_forts"
    - "points_faibles"
    - "red_flags"
    - "recommandation"
    - "angle_motivation"
    - "raison_breve"

# Configuration Scraping
scraping:
  enabled_sites:
    - indeed
    - apec
    - welcome_to_the_jungle
    - emploi_asso
    # - pole_emploi
    # - linkedin

  rate_limiting:
    delay_between_requests_seconds: 2
    max_retries: 3
    timeout_seconds: 30

  max_jobs_per_site:
    indeed: 40
    apec: 40
    welcome_to_the_jungle: 30
    emploi_asso: 60

  max_job_age_days: 14

# Configuration Google Sheets
google_sheets:
  main_sheet_name: "Job Search Automation - Facundo Varas"
  tabs:
    - name: "Nouvelles Offres"
      keep_days: 7
    - name: "À Postuler"
      filter_status: ["À POSTULER", "POSTULÉ"]
    - name: "Statistiques"
      auto_graphs: true
    - name: "Configuration"
      editable: true

  recommended_columns:
    - "date_found"
    - "site"
    - "title"
    - "company"
    - "location"
    - "contract"
    - "url"
    - "score_total"
    - "score_poste"
    - "score_secteur"
    - "score_location"
    - "skills_bonus"
    - "salary_score"
    - "salary_gross_monthly"
    - "red_flags_count"
    - "raison_resume"
    - "statut"
    - "prochaine_action_date"
    - "lettre_motivation_draft"

# Configuration Email
email:
  send_daily: true
  send_time_utc: "07:00" # 8h Paris hiver
  recipient: "varas.cundo@gmail.com"

  content:
    max_jobs_in_email: 15
    include_maybe_jobs: true
    include_statistics: true

  triggers:
    send_even_if_no_jobs: true
    alert_on_high_priority_job: true
    high_priority_threshold_score: 85

# Configuration Cache
cache:
  enabled: true
  deduplicate_by:
    - "url"
    - "title + company"
  cache_duration_days: 30

# Logging
logging:
  level: "INFO" # DEBUG, INFO, WARNING, ERROR
  save_to_file: true
  file_path: "data/logs/"

# Notifications
notifications:
  email_on_error: true
  email_on_success: false
  slack_webhook: null
